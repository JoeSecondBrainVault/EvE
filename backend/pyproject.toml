[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eve-assistant"
version = "0.1.0"
description = "E.V.E. - local-first AI study and work assistant (audio capture, STT, notes, tasks)."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.146,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic-settings>=2.16,<3",
    "sqlmodel>=0.0.48,<0.1",
    "numpy>=2.1,<3",
    "soxr>=1.1,<2",
    "PyAudioWPatch>=0.2.12.9,<0.3; platform_system == 'Windows'",
    "faster-whisper>=1.2.1,<2",
    "google-genai>=2.31,<3",
    "apscheduler>=3.11,<4",
    "winotify>=1.0,<2; platform_system == 'Windows'",
    "sqlite-vec>=0.1.9,<0.2",
    "keyring>=25.7,<26",
    "google-auth-oauthlib>=1.5,<2",
    "google-api-python-client>=2.201,<3",
    "kokoro-onnx>=0.6.1,<1",
    "sounddevice>=0.5.6,<1",
    "openwakeword>=0.6.0,<1",
    "pystray>=0.19.5,<1; platform_system == 'Windows'",
    "Pillow>=10.4,<14",
    "pypdf>=5.1,<7",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.18,<1",
]

[project.optional-dependencies]
# CUDA 12 runtime DLLs for ctranslate2 4.x on Windows (no system CUDA Toolkit needed).
gpu = [
    "nvidia-cublas-cu12>=12.4,<13",
    "nvidia-cudnn-cu12>=9.1,<10",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "detect-secrets>=1.5",
]

[project.scripts]
eve = "eve.cli:main"

[tool.setuptools.packages.find]
include = ["eve*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA GPU and downloads a Whisper model (deselect with -m 'not gpu')"]
